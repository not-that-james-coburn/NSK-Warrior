name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'booklet/**'
      - 'capacitor.config.json'
      - 'db-health-checker.js'
      - 'gamepad.js'
      - 'images/**'
      - 'index.html'
      - 'loading-ring.js'
      - 'manifest.json'
      - 'native-web/**'
      - 'notification-manager.js'
      - 'package.json'
      - 'scripts/**'
      - 'service-worker.js'
      - 'styles/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'capacitor.config.json'
      - 'native-web/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/ios.yml'

jobs:
  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare hosted native shell
        run: npm run build:web

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: nsk-warrior-ios-simulator-app
          path: build/ios-derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
