<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An original game created with RPG Maker (PSX), and made playable in the browser by EmulatorJS. Select version.">
  <title>NSK Warrior</title>
  <link rel="stylesheet" href="/booklet/booklet.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/192x192.png">
  <link rel="icon" href="/favicon.ico">
  
  
  
  <script src="/notification-manager.js"></script>
  <script src="/app.js"></script>
  
</head>

<body>
  
  <video poster="/images/title-poster-frame-001.jpg" autoplay loop muted playsinline class="bg-layer" id="bg-img">
    <source src="/images/NSK_Warrior_title.mp4" type="video/mp4">
    <img src="images/title.avif" class="bg-layer" id="bg-img">
  </video>
  
  <div id="ui-layer">
    <div id="start-menu"></div>
    <div id="version-menu">
      <!--h2 style="margin:0 0 15px 0; text-shadow: 2px 2px 4px black;">SELECT VERSION</h2-->
      <div id="version-list-root"></div>
    </div>
  </div>
  
  <div id="game-container">
    <div id="game"></div>
  </div>
  
  <div id="book-container">
    <div id="book"></div>
    <div class="button-wrapper" id="button-wrapper">
      <input type="checkbox" id="toggleButton" class="toggle-button">
      <label for="toggleButton">
        <img src="booklet/manual_icon.webp" width="40" height="40" alt="Game Booklet">
      </label>
    </div>
  </div>
  
  <audio id="flip" src="booklet/sounds/page_turn.mp3"></audio>
  <audio id="slide1" src="booklet/sounds/slide_in.mp3"></audio>
  <audio id="slide2" src="booklet/sounds/slide_out.mp3"></audio>
  <div id="blurBackground" class="blurred-background display-none"></div>
  
  <div id="custom-modal-overlay">
    <div id="custom-modal">
      <p id="modal-message" class="modal-copy"></p>
      <p id="info-modal-message" class="modal-copy"></p>
      <div id="modal-buttons"></div>
    </div>
  </div>
  
  <div id="custom-loader-overlay" class="loader-overlay display-none">
    <div class="loading-img-container">
      <img src="/images/bearing.gif" alt="spinning bearing gif">
    </div>
    <div class="loader-container">
      <div class="loader-center">
        <span class="status-text" id="status-task">Loading</span>
        <span class="percentage-text" id="loading-text">0%</span>
      </div>
      <svg>
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="progress-ring" id="loading-ring" cx="100" cy="100" r="100"></circle>
      </svg>
    </div>
  </div>
  
  <script src="/db-health-checker.js"></script>
  <script src="/booklet/jquery-3.7.1.min.js"></script>
  <script src="/booklet/turn.min.js"></script>
  <script src="/booklet/panzoom.min.js"></script>
  <script src="/booklet/booklet.js"></script>
  <script src="version-manager.js"></script>
  <script src="gamepad.js"></script>
  <script src="loading-ring.js"></script>
  
</body>

</html>
